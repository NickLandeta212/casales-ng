<div class="container">
  <div class="d-flex justify-content-center align-items-center vh-100">
    <div class="container">
      <div class="card login-card">
        <div class="row">
          <div class="col-md-4">
            <div class="login-logo-panel">
              <img src="img/casales-logo.jpeg" alt="Casales San Pedro" class="login-logo img-fluid">
            </div>
          </div>
          <div class="col-md-8">
            <div class="row mt-5">
              <div class="col-md-10">
                <h1 mt-1 mb-2>Casales San Pedro</h1>
                <p></p>
              </div>
              <div class="col-md-10 mt-1 mb-3">
                <p class="lead">Bienvenido de nuevo. Inicia sesión para continuar.</p>
                <span class="login-security-note"> <i class="bi bi-lock"></i> Todos los datos se cifrarán</span>
              </div>
              <div *ngIf="errorMessage !== ''" class="col-md-10 mt-1 mb-3">
                <div class="alert alert-danger" role="alert">{{ errorMessage }}</div>
              </div>

              <div class="col-md-10 mt-1 mb-3">

              </div>

              <div class="col-md-10">
                <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                  <div class="mb-3">
                    <label for="username" class="form-label">Usuario o correo</label>
                    <input #usernameInput type="text" id="username" class="form-control form-control-lg" formControlName="username" placeholder="Ej: T3D603" autocomplete="username" autocapitalize="off" spellcheck="false">
                    <div class="text-danger"
                      *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
                      Ingresa tu usuario.
                    </div>
                  </div>
                  <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <div class="position-relative">
                      <input #passwordInput [type]="showPassword ? 'text' : 'password'" id="password"
                        class="form-control form-control-lg pe-5" formControlName="password"
                        placeholder="Ingresa tu contraseña" autocomplete="current-password" />
                      <button class="password-toggle" type="button" (click)="togglePassword()" [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
                        <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
                      </button>
                    </div>
                    <div class="text-danger mt-1"
                      *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
                      Ingresa una contraseña de al menos 8 caracteres.
                    </div>
                  </div>
                  <div class="mb-3">
                    <button type="submit" class="btn btn-lg btn-success w-100" [disabled]="loading">
                      {{ loading ? 'Ingresando...' : 'Ingresar' }}
                    </button>
                  </div>
                  <div class="center">
                    <div class="mb-3">
                      <a href="#"
                        class="text-decoration-none action-cell">¿Olvidaste tu contraseña?</a>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
